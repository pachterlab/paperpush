# Render Blueprint for the paperpush website. In the Render dashboard choose
# New > Blueprint and point it at this repository; Render builds the Dockerfile.
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: paperpush
    runtime: docker
    plan: free
    branch: main
    healthCheckPath: /healthz
    # Deploy a commit to main only after its GitHub checks (CI, security)
    # pass. main itself only takes reviewed pull requests (branch protection).
    autoDeployTrigger: checksPass
    envVars:
      # Visitors supply their own API keys for AI features.
      - key: PAPERPUSH_WEB_AI
        value: "1"
      # Check links, DOIs, references, and (double-blind) the records and pages
      # linked from uploaded files. Fetches go through paperpush.net_guard,
      # which refuses internal addresses.
      - key: PAPERPUSH_WEB_NETWORK_CHECKS
        value: "1"
      - key: PAPERPUSH_WEB_TTL_HOURS
        value: "24"
      - key: PAPERPUSH_WEB_MAX_WORKSPACE_MB
        value: "200"
      # "Share for editing" stores encrypted forms in Postgres, since this
      # plan's disk is wiped on every deploy. Paste a Neon connection string
      # (postgresql://...?sslmode=require) in the dashboard; it is a secret.
      - key: PAPERPUSH_WEB_DATABASE_URL
        sync: false
