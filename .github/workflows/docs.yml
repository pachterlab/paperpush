name: Docs

# Builds the Sphinx documentation. On every push and pull request it builds with
# warnings treated as errors, so a broken cross-reference or a bad docstring
# fails CI. On a push to main it also publishes the built HTML to GitHub Pages.
#
# This complements (does not replace) Read the Docs, which builds and hosts the
# docs independently from .readthedocs.yaml. Keeping the build in CI catches
# doc breakage on pull requests, before it reaches Read the Docs.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

# Allow the deploy job to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two Pages deploys at once; let an in-progress run finish.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install paperpush and docs requirements
        run: |
          python -m pip install --upgrade pip
          # Install the package so autodoc can import it (Playwright and
          # anthropic are mocked in docs/conf.py, so no browsers/keys needed).
          pip install .
          pip install -r docs/requirements.txt

      - name: Build HTML (warnings as errors)
        run: python -m sphinx -b html -W --keep-going docs docs/_build/html

      - name: Upload Pages artifact
        # Only need the artifact for the deploy job, which runs on main.
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    # Publish to GitHub Pages only from main.
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
