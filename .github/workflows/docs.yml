name: Docs

# Builds the Sphinx documentation with warnings treated as errors, so a broken
# cross-reference or a bad docstring fails the build.
#
# This is a CHECK ONLY -- it does not publish anywhere. The docs are hosted by
# Read the Docs (https://paperpush.readthedocs.io), which builds them itself from
# .readthedocs.yaml via a GitHub webhook, outside of Actions. Read the Docs also
# sets fail_on_warning, but a failed build there does not block a pull request --
# this job is what makes broken docs a red check before the merge.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

# A superseded docs build has nothing to publish, so drop it and keep the newest.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install paperpush and docs requirements
        run: |
          python -m pip install --upgrade pip
          # Install the package so autodoc can import it (Playwright and
          # anthropic are mocked in docs/conf.py, so no browsers/keys needed).
          pip install .
          pip install -r docs/requirements.txt

      - name: Build HTML (warnings as errors)
        run: python -m sphinx -b html -W --keep-going docs docs/_build/html
