name: Nature subject-category refresh

# Nature's subject classification (paperpush/venues/_assets/nature_categories.json)
# can only be scraped from the live submission wizard, since the dependent
# subject menus (a variable-depth tree, two to four levels) render partway
# through it. Once a month this walks a throwaway
# draft to the subjects step, scrapes the live category tree, rewrites the stored
# file if it has drifted, and opens a pull request with the change. A real
# submission no longer scrapes (it just selects the chosen categories), so this
# is the only place the stored list is kept current.
#
# The walk leaves a clearly-titled dummy draft ("AUTOMATED CATEGORY CHECK - DO
# NOT SUBMIT") and best-effort deletes it; if the delete control isn't found, the
# job log says so and you can remove it by hand.
#
# SETUP (one time):
#   1. Locally sign in and save a Nature session:
#        paperpush session nature
#   2. Base64-encode it:
#        base64 -i ~/.config/paperpush/nature_session.json | pbcopy
#   3. Repo -> Settings -> Secrets and variables -> Actions -> New secret:
#        NATURE_SESSION_B64
#
# The session expires periodically; when the job reports "session looks expired",
# redo steps 1-3 to refresh the secret.
#
# Security note: the secret is a live session to a real Nature account. Safe in a
# PRIVATE repo; reconsider before making the repo public, since anyone who can
# edit a workflow could exfiltrate it.

on:
  schedule:
    - cron: "0 3 1 */6 *"   # 03:00 UTC on the 1st of each 6 months
  workflow_dispatch: {}    # allow manual runs from the Actions tab

permissions:
  contents: write          # commit the refreshed JSON to a branch
  pull-requests: write     # open the PR

jobs:
  categories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install paperpush + Playwright
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python -m playwright install --with-deps chromium

      - name: Restore saved Nature session
        env:
          NATURE_SESSION_B64: ${{ secrets.NATURE_SESSION_B64 }}
        run: |
          if [ -z "${NATURE_SESSION_B64}" ]; then
            echo "::error::NATURE_SESSION_B64 is unset; cannot run the category check."
            exit 1
          fi
          mkdir -p "${HOME}/.config/paperpush"
          echo "${NATURE_SESSION_B64}" | base64 --decode > "${HOME}/.config/paperpush/nature_session.json"
          echo "Restored Nature session."

      - name: Refresh subject categories
        run: |
          set -o pipefail
          paperpush -v check-categories nature | tee categories.log

      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nature-categories-log
          path: categories.log
          if-no-files-found: ignore

      - name: Open a pull request if the categories changed
        uses: peter-evans/create-pull-request@v6
        with:
          add-paths: paperpush/venues/_assets/nature_categories.json
          branch: nature-categories-refresh
          delete-branch: true
          commit-message: "Refresh Nature subject categories"
          title: "Refresh Nature subject categories"
          body: |
            Nature's live subject-category tree drifted from the committed
            `nature_categories.json`. This PR was opened automatically by the
            monthly **Nature subject-category refresh** workflow.

            Review the diff to confirm the added, removed, or renamed subjects
            look right, then merge.
