name: Portal fingerprint check

# The second live-portal signal, complementing the submit walkthrough
# (submit.yml). The walkthrough proves a submission still *works*; this proves a
# portal has not *changed* -- it diffs each venue's login page and first wizard
# step against the committed fingerprint in tests/portal_snapshots and fails if
# the structure moved, even when that change would not (yet) break a submission
# (e.g. a portal adds a required field the runner does not touch).
#
# Keeping the two as separate checks is deliberately diagnostic:
#   walkthrough ✅ + fingerprint ❌ -> the portal changed but still works; update
#                                      the runner (or refresh the baseline)
#                                      before it bites a real submission.
#   walkthrough ❌ + fingerprint ✅ -> submit broke for a NON-UI reason (flaky
#                                      network, an anti-bot wall, a stale
#                                      session), not a changed page.
#   both ❌                         -> a breaking UI change; selectors moved.
#
# Coverage has two layers (see tests/test_portal_drift.py):
#   * test_login_page_drift  -- network only; runs for every venue with a drift
#                               spec, no session needed.
#   * test_first_step_drift  -- needs a signed-in session per venue, restored
#                               from the shared PAPERPUSH_SESSIONS_B64 bundle. A
#                               venue not in the bundle simply skips its
#                               first-step check; the login-page check still
#                               runs. So this workflow does something useful even
#                               with no secret set.
#
# A failed run emails the repo watchers (GitHub's default notification) and
# uploads a screenshot + HTML of the changed page (the portal-fingerprint
# artifact) so the drift can be diagnosed offline. If the change is intended,
# refresh the baselines with `pytest --run-portal --update-snapshots` and commit.
#
# SETUP: none beyond submit.yml's -- the same PAPERPUSH_SESSIONS_B64 bundle is
# reused through the shared restore action, so a venue checked by the walkthrough
# is checked here too.
#
# Security note: each secret is a live session to a real venue account. Safe in
# a PRIVATE repo only -- anyone who can edit a workflow could exfiltrate it.

on:
  schedule:
    - cron: "0 9 1 */2 *"   # 09:00 UTC on the 1st of each 2 months
  workflow_dispatch: {}    # allow manual runs from the Actions tab

jobs:
  fingerprint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install paperpush (with dev extras) + Playwright
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python -m playwright install --with-deps chromium

      - name: Restore saved portal sessions
        id: sessions
        uses: ./.github/actions/restore-portal-sessions
        with:
          sessions_b64: ${{ secrets.PAPERPUSH_SESSIONS_B64 }}

      - name: Check portals for structural drift
        run: |
          set -o pipefail
          # No --venue filter: the drift tests parametrize over every venue and
          # skip those without a spec or (for first-step) a session, so this
          # checks every portal we have a baseline for. A real drift makes pytest
          # exit non-zero and fails the job loudly; all-skip exits 0.
          pytest -v -p no:cacheprovider --run-portal \
            tests/test_portal_drift.py \
            2>&1 | tee fingerprint.log

      - name: Upload fingerprint log and failure captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portal-fingerprint
          path: |
            fingerprint.log
            tests/portal_snapshots/_failures/
          if-no-files-found: ignore
