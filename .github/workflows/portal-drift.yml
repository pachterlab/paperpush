name: Portal drift check

# Runs tests/test_portal_drift.py against the live submission portals and fails
# if a portal's sign-in page or first wizard step no longer matches the
# committed fingerprint in tests/portal_snapshots -- i.e. the portal changed its
# UI. A failed run emails the repo watchers (GitHub's default notification), so
# an interface change surfaces here instead of during a real submission.
#
# Two layers of coverage:
#   * test_login_page_drift  -- needs only network access; always runs.
#   * test_first_step_drift  -- needs a signed-in session per venue, restored
#                               from the *_SESSION_B64 secrets below. Skips a
#                               venue whose secret is unset.
#
# SETUP (one time, per venue):
#   1. Locally sign in and save a session, e.g. for bioRxiv:
#        paperpush check-portal --login
#      (bioinformatics: sign in once so a session file is written to
#       ~/.config/paperpush/bioinformatics_session.json)
#   2. Base64-encode it:
#        base64 -i ~/.config/paperpush/biorxiv_session.json | pbcopy
#   3. Repo -> Settings -> Secrets and variables -> Actions -> New secret:
#        BIORXIV_SESSION_B64         (bioRxiv session)
#        BIOINFORMATICS_SESSION_B64  (bioinformatics session)
#
# Sessions expire periodically; when first_step skips with "session looks
# expired", redo steps 1-3 to refresh that secret.
#
# Security note: each secret is a live session to a real venue account. Safe in
# a PRIVATE repo; reconsider before making the repo public, since anyone who can
# edit a workflow could exfiltrate it.

on:
  schedule:
    - cron: "0 9 * * 1"   # Mondays 09:00 UTC
  workflow_dispatch: {}    # allow manual runs from the Actions tab

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install paperpush + Playwright
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python -m playwright install --with-deps chromium

      - name: Restore saved portal sessions
        env:
          BIORXIV_SESSION_B64: ${{ secrets.BIORXIV_SESSION_B64 }}
          BIOINFORMATICS_SESSION_B64: ${{ secrets.BIOINFORMATICS_SESSION_B64 }}
        run: |
          mkdir -p "${HOME}/.config/paperpush"
          if [ -n "${BIORXIV_SESSION_B64}" ]; then
            echo "${BIORXIV_SESSION_B64}" | base64 --decode > "${HOME}/.config/paperpush/biorxiv_session.json"
            echo "Restored bioRxiv session."
          else
            echo "::warning::BIORXIV_SESSION_B64 unset; bioRxiv first-step check will skip."
          fi
          if [ -n "${BIOINFORMATICS_SESSION_B64}" ]; then
            echo "${BIOINFORMATICS_SESSION_B64}" | base64 --decode > "${HOME}/.config/paperpush/bioinformatics_session.json"
            echo "Restored bioinformatics session."
          else
            echo "::warning::BIOINFORMATICS_SESSION_B64 unset; bioinformatics first-step check will skip."
          fi

      - name: Run portal drift tests
        run: |
          set -o pipefail
          pytest -v --run-portal tests/test_portal_drift.py | tee drift.log

      - name: Upload drift log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portal-drift-log
          path: drift.log
          if-no-files-found: ignore
