name: bioRxiv interface check

# Walks the bioRxiv submission wizard with dummy data and fails if a selector
# our submitter relies on has gone missing -- i.e. bioRxiv changed its UI. A
# failed run emails the repo watchers (GitHub's default notification), so an
# interface change surfaces here instead of during a real submission.
#
# SETUP (one time):
#   1. Locally sign in and save a session:
#        paperpush check-portal --login
#   2. Base64-encode it and copy to your clipboard:
#        base64 -i ~/.config/paperpush/biorxiv_session.json | pbcopy
#   3. Repo -> Settings -> Secrets and variables -> Actions -> New secret:
#        name:  BIORXIV_SESSION_B64    value: (paste)
#
# The session expires periodically; when this workflow fails with
# "auth_required", redo steps 1-3 to refresh the secret.
#
# Security note: this secret is a live session to a real bioRxiv account. It is
# safe in a PRIVATE repo. Before making the repo public, reconsider -- anyone who
# can edit a workflow could exfiltrate it.

on:
  schedule:
    - cron: "0 9 * * 1"   # Mondays 09:00 UTC
  workflow_dispatch: {}    # allow manual runs from the Actions tab

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install paperpush + Playwright
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          python -m playwright install --with-deps chromium

      - name: Restore bioRxiv session
        env:
          SESSION_B64: ${{ secrets.BIORXIV_SESSION_B64 }}
        run: |
          if [ -z "${SESSION_B64}" ]; then
            echo "::error::BIORXIV_SESSION_B64 secret is not set. See the setup notes in this workflow file."
            exit 1
          fi
          mkdir -p "${HOME}/.config/paperpush"
          echo "${SESSION_B64}" | base64 --decode > "${HOME}/.config/paperpush/biorxiv_session.json"

      - name: Check bioRxiv portal
        run: |
          set -o pipefail
          paperpush check-portal --discard -v | tee check.log

      - name: Upload check log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portal-check-log
          path: check.log
          if-no-files-found: ignore
