name: Submit walkthrough

# The single live-portal job. On a schedule (and on demand) it drives each
# venue's REAL submission portal headless -- validation, sign-in, wizard,
# stopping before the final submit, exactly like the manual `paperpush submit`
# walkthrough -- to prove the flow still works, and records the outcome into
# tests/submit_walkthrough_status.json. It then regenerates the venue tables and
# opens a pull request so the ✅ / ❌ "Submit walkthrough" column in
# venues.md / README.md stays current without a hand-run.
#
# Pass/fail is the portal signal: a venue that completes the walkthrough is
# stamped with today's date (✅); one that fails every attempt is dropped from
# the status file so it renders ❌. The walkthrough retries each venue up to 3
# times (baked into the test) so a flaky portal does not flip a venue to ❌ on a
# one-off hiccup.
#
# The PR auto-merges when the only change is date bumps -- i.e. every venue kept
# its ✅/❌ status and just advanced its date. If any venue flips ✅<->❌, the PR
# is left open for manual review, with the failed venues named in a comment.
#
# SETUP (one time): sign in to each venue you want checked, then bundle all the
# saved sessions into ONE secret, PAPERPUSH_SESSIONS_B64. The restore step picks
# up whichever venues are in the bundle -- no workflow edit is needed to add one.
#
#   1. Locally sign in and save a session for each venue, e.g.:
#        paperpush login biorxiv
#        paperpush login bioinformatics
#   2. Bundle every saved session into one base64 blob:
#        tar -C ~/.config/paperpush -czf - *_session.json | base64 | pbcopy
#   3. Store it as a secret visible to this repo (an org or environment secret if
#      it lives in paperpush-private), named PAPERPUSH_SESSIONS_B64.
#
# Sessions expire periodically; when a venue stops passing (walkthrough.log
# shows "auth_required"/"session looks expired"), redo steps 1-2 to refresh the
# bundle.
#
# Security note: each secret is a live session to a real venue account. Safe in
# a PRIVATE repo only -- anyone who can edit a workflow could exfiltrate it.

on:
  schedule:
    - cron: "0 3 1 */2 *"   # 03:00 UTC on the 1st of each 2 months
  workflow_dispatch: {}    # allow manual runs from the Actions tab

permissions:
  contents: write        # push the refresh branch
  pull-requests: write   # open the PR

jobs:
  walkthrough:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install paperpush (with dev extras) + Playwright
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python -m playwright install --with-deps chromium

      - name: Restore saved portal sessions
        id: sessions
        # Registry-driven restore, shared with fingerprint.yml. For every venue
        # in the database it looks for a <SLUG>_SESSION_B64 secret and restores
        # any that are set, emitting the matching `--venue` flags. Adding a venue
        # needs no edit here -- just create its secret.
        uses: ./.github/actions/restore-portal-sessions
        with:
          all_secrets: ${{ toJSON(secrets) }}

      - name: Require at least one restored session
        # The walkthrough drives real portals, so unlike fingerprint.yml (whose
        # login-page checks need no session) it has nothing to do with zero
        # sessions -- fail early and clearly rather than run an empty pytest.
        run: |
          if [ -z "${{ steps.sessions.outputs.venues }}" ]; then
            echo "::error::No <SLUG>_SESSION_B64 secrets set; nothing to walk."
            exit 1
          fi

      - name: Run submit walkthroughs (headless) and record outcomes
        env:
          PAPERPUSH_WALKTHROUGH_HEADLESS: "1"
        run: |
          set -o pipefail
          # A per-venue failure must not abort the run -- pytest tests each venue
          # independently, and the test itself retries up to 3x then records the
          # outcome (✅ via record_success on a clean exit, ❌ via record_failure
          # after all attempts fail). So `|| true` keeps the step green
          # regardless; the status JSON is the real signal. `set -o pipefail`
          # still lets `tee` capture the full log.
          pytest -v -p no:cacheprovider --run-portal \
            "tests/test_submit.py::test_submit_walkthrough" \
            ${{ steps.sessions.outputs.venues }} \
            2>&1 | tee walkthrough.log || true

      - name: Regenerate venue tables from the new outcomes
        run: python scripts/gen_readme_venues.py

      - name: Open a PR (auto-merge when only dates changed)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- tests/submit_walkthrough_status.json venues.md README.md; then
            echo "No checkmark changes this run; not opening a PR."
            exit 0
          fi

          # Did any venue flip ✅<->❌, or did only dates advance? A slug present
          # in the status file is ✅ and absent is ❌, so an unchanged *set* of
          # slugs means every checkmark kept its status and only dates moved --
          # safe to auto-merge. Compare the committed (HEAD) file to the new one.
          old_keys=$(git show HEAD:tests/submit_walkthrough_status.json 2>/dev/null \
            | python -c "import json,sys; print(chr(10).join(sorted(json.load(sys.stdin))))" || true)
          new_keys=$(python -c "import json; print(chr(10).join(sorted(json.load(open('tests/submit_walkthrough_status.json')))))")
          if [ "${old_keys}" = "${new_keys}" ]; then only_dates=yes; else only_dates=no; fi
          echo "only_dates=${only_dates}"

          month="$(date -u +%Y-%m)"
          branch="checkmarks/refresh-${month}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "${branch}"
          git add tests/submit_walkthrough_status.json venues.md README.md
          git commit -m "chore: refresh submit-walkthrough checkmarks (${month})"
          # Force so a re-run in the same month updates the existing branch.
          git push --force origin "${branch}"

          if [ "${only_dates}" = "yes" ]; then
            body="Automated refresh: only ✅ dates advanced -- no venue changed status. Auto-merging."
          else
            body="Automated refresh: **a venue's ✅/❌ status changed this run** -- review before merging. See the \`walkthrough-log\` artifact for which venue(s) failed."
          fi
          # Create the PR, or (if one already exists for this branch) just note
          # that the push updated it.
          gh pr create \
            --title "Refresh submit-walkthrough checkmarks (${month})" \
            --body "${body}" \
            --head "${branch}" \
            --base "${{ github.ref_name }}" \
          || echo "::notice::PR for ${branch} already exists; pushed the update to it."

          # Name the venues whose walkthrough failed this run, straight from the
          # "recorded submit walkthrough FAILURE for <slug>" lines the test
          # prints. Posting them as a PR comment means a status-flip PR says
          # which portal broke without opening the walkthrough-log artifact.
          # Done before the merge below so the branch still exists to comment on.
          if [ -f walkthrough.log ]; then
            failed=$(grep -oE 'recorded submit walkthrough FAILURE for [a-z0-9_]+' walkthrough.log \
              | awk '{print $NF}' | sort -u || true)
            if [ -n "${failed}" ]; then
              list=$(echo "${failed}" | sed 's/^/- /')
              gh pr comment "${branch}" --body "$(printf '⚠️ The following venue walkthrough(s) failed this run and are now ❌:\n\n%s\n\nSee the **walkthrough-log** artifact for the full output.' "${list}")" \
                || echo "::warning::Could not post the failed-venue comment."
            fi
          fi

          # Auto-merge only when no venue flipped status; a flip means a portal
          # newly broke (or recovered), which deserves a human look.
          if [ "${only_dates}" = "yes" ]; then
            echo "Only date bumps -> auto-merging."
            gh pr merge "${branch}" --squash --delete-branch --auto \
              || echo "::warning::Could not enable auto-merge. Turn on 'Allow auto-merge' under Settings -> General -> Pull Requests, or merge the PR manually."
          else
            echo "::notice::A venue flipped ✅<->❌ this run; leaving the PR open for manual review."
          fi

      - name: Upload walkthrough log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: walkthrough-log
          path: walkthrough.log
          if-no-files-found: ignore
