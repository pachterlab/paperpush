name: Validate benchmark

# Scores `paperpush validate` against real papers whose findings were reviewed by
# hand (tests/validate_benchmark/*.json): fails when a change brings back a false
# alarm fixed earlier or loses a real finding. It downloads the papers (arXiv PDFs, and
# bioRxiv preprints' Europe PMC full text),
# so it runs monthly and on demand, not on every push (see scripts/validate_benchmark.py).

on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch: {}

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install paperpush (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # The bioRxiv papers are validated as Word files made from their Europe PMC full text
      # (scripts/jats_to_docx.py), which needs pandoc.
      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      # The papers are pinned to a version, so a cached PDF never goes stale.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/paperpush-benchmark
          key: validate-benchmark-${{ hashFiles('tests/validate_benchmark/*.json') }}
          restore-keys: validate-benchmark-

      - name: Run the benchmark
        run: python scripts/validate_benchmark.py -v --json benchmark.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: validate-benchmark
          path: benchmark.json
