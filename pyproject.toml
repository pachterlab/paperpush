[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paperpush"
version = "0.1.4"
description = "A Python library for automating the submission of manuscripts to academic venues."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    {name = "Joseph Rich", email = "josephrich98@gmail.com"}
]
maintainers = [
    {name = "Joseph Rich", email = "josephrich98@gmail.com"}
]
dependencies = [
    "playwright>=1.40",
    "keyring>=24.0",
    "pydantic>=2.0",
    "pypdf>=6.0.0",
    "pillow>=10.0",
]

[project.urls]
Homepage = "https://github.com/pachterlab/paperpush"
Repository = "https://github.com/pachterlab/paperpush"
Documentation = "https://github.com/pachterlab/paperpush#readme"
Issues = "https://github.com/pachterlab/paperpush/issues"

[project.optional-dependencies]
autofill = ["anthropic>=0.40"]
mcp = ["mcp>=1.2"]
dev = ["pytest>=7.0", "bandit", "black", "jsonschema>=4.18", "sphinx", "isort"]

[project.scripts]
paperpush = "paperpush.cli:main"
paperpush-mcp = "paperpush.mcp_server:main"

[tool.pytest.ini_options]
# Put the repo root on sys.path so test modules can import the `tests` package
# (e.g. `from tests.conftest import ...`) regardless of whether pytest is invoked
# as `pytest` or `python -m pytest`.
pythonpath = ["."]
markers = [
    "portal: test hits a real submission portal; skipped unless --run-portal (or PAPERPUSH_RUN_PORTAL=1) is given",
]

# Discover every paperpush subpackage automatically. An explicit list silently
# drops any venue package that isn't added here, which breaks non-editable
# installs (the missing module imports fine in an editable checkout but is
# absent from the built wheel).
[tool.setuptools.packages.find]
include = ["paperpush*"]

[tool.setuptools.package-data]
# "_assets/*" (not "*.json") so the .txt category/keyword files ship too.
# "_docs/*.md" carries the agent-facing guide (mirrored from the repo root by
# scripts/sync_agent_docs.py) so `paperpush agent-guide` works from a plain pip
# install, where the repo's AGENTS.md is not present.
paperpush = ["venues.json", "venues.schema.json", "subfile_templates/*.sub", "_docs/*.md"]
"paperpush.venues" = ["_assets/*"]

[tool.black]
target-version = ["py310", "py311", "py312"]
